<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FluxGraph Visual Demo</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --border: #2a3441;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #10b981;
    --yellow: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header h1 .tag { color: var(--accent); }
  header .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
  header .legend span::before {
    content: ""; display: inline-block; width: 10px; height: 10px;
    border-radius: 50%; margin-right: 4px; vertical-align: middle;
  }
  .leg-idle::before    { background: #475569; }
  .leg-running::before { background: var(--blue); }
  .leg-done::before    { background: var(--green); }
  .leg-paused::before  { background: var(--yellow); }
  .leg-error::before   { background: var(--red); }

  main {
    display: grid; grid-template-columns: 1.4fr 1fr;
    height: calc(100vh - 49px);
  }
  #graph { background: #0a0e13; }
  aside {
    border-left: 1px solid var(--border); display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .panel h3 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); font-weight: 600;
  }
  textarea {
    width: 100%; min-height: 60px; padding: 8px; border-radius: 6px;
    background: #0a0e13; color: var(--text); border: 1px solid var(--border);
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  button {
    background: var(--accent); color: #0a0e13; border: 0; padding: 6px 14px;
    border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 13px;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost {
    background: transparent; color: var(--text); border: 1px solid var(--border);
    font-weight: 400; font-size: 12px; padding: 4px 10px; margin-right: 6px;
  }
  button.ghost:hover { border-color: var(--accent); color: var(--accent); }
  button.approve { background: var(--green); color: #0a0e13; }
  button.reject  { background: var(--red);   color: #fff; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > button { white-space: nowrap; }

  .scroll { flex: 1; overflow-y: auto; }
  #trace { font-family: ui-monospace, monospace; font-size: 12px; line-height: 1.6; }
  #trace .step {
    padding: 4px 8px; border-left: 2px solid var(--border); margin-bottom: 2px;
  }
  #trace .step.running { border-left-color: var(--blue); color: var(--blue); }
  #trace .step.done    { border-left-color: var(--green); }
  #trace .step.error   { border-left-color: var(--red);   color: var(--red); }
  #trace .step.paused  { border-left-color: var(--yellow); color: var(--yellow); }
  #trace .step .elapsed { color: var(--muted); margin-left: 6px; font-size: 11px; }
  #trace .meta { color: var(--muted); font-size: 11px; padding: 8px; }

  .msg { padding: 6px 10px; margin: 4px 0; border-radius: 6px; font-size: 12px; }
  .msg.User       { background: #1e3a5f; }
  .msg.Assistant  { background: #1e3a2f; }
  .msg.Tool       { background: #3a2f1e; font-family: ui-monospace, monospace; }
  .msg.System     { background: #2a2a3a; font-style: italic; }
  .msg .role { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .msg .body { white-space: pre-wrap; word-break: break-word; }

  .kv { font-family: ui-monospace, monospace; font-size: 12px; }
  .kv .k { color: var(--accent); }
  .kv .v { color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>FluxGraph <span class="tag">visual</span> demo</h1>
  <div class="legend">
    <span class="leg-idle">Idle</span>
    <span class="leg-running">Running</span>
    <span class="leg-done">Done</span>
    <span class="leg-paused">Paused</span>
    <span class="leg-error">Error</span>
  </div>
</header>
<main>
  <div id="graph"></div>
  <aside>
    <div class="panel">
      <h3>Input</h3>
      <textarea id="input" placeholder="e.g. 我要退款">我要退款，订单 #A2026 收到的不是我想要的</textarea>
      <div style="margin-top:8px" class="row">
        <button id="sendBtn">Send</button>
        <div style="margin-left:auto">
          <button class="ghost" data-preset="我要退款，订单 #A2026 收到的不是我想要的">退款</button>
          <button class="ghost" data-preset="帮我查一下订单 #B1733 现在到哪了">查订单</button>
          <button class="ghost" data-preset="我要投诉你们的产品有质量问题">转人工</button>
        </div>
      </div>
      <div id="approvalRow" class="row" style="margin-top:10px; display:none">
        <span style="color:var(--yellow); font-size:12px">⏸ 等待人工审批：</span>
        <button class="approve" id="approveBtn">Approve</button>
        <button class="reject"  id="rejectBtn">Reject</button>
      </div>
    </div>
    <div class="panel scroll" style="flex:1; padding:0">
      <div class="panel" style="border:0; padding:14px 16px 6px">
        <h3>Execution Trace</h3>
      </div>
      <div id="trace" style="padding: 0 16px 16px;">
        <div class="meta">No execution yet. Click Send to start.</div>
      </div>
      <div class="panel" style="border-top:1px solid var(--border); border-bottom:0">
        <h3>Messages</h3>
        <div id="messages"><div class="meta" style="padding:0">—</div></div>
      </div>
      <div class="panel" style="border:0">
        <h3>Variables</h3>
        <div id="vars" class="kv">—</div>
      </div>
    </div>
  </aside>
</main>

<script>
const NODE_KIND_COLOR = {
  entry:    { bg: "#1e3a5f", border: "#3b82f6" },
  llm:      { bg: "#3a1e5f", border: "#a855f7" },
  tool:     { bg: "#3a2f1e", border: "#f59e0b" },
  human:    { bg: "#5f3a1e", border: "#ef4444" },
  terminal: { bg: "#1e3a2f", border: "#10b981" },
};

const STATE_COLOR = {
  idle:    { bg: "#1f2937", border: "#475569" },
  running: { bg: "#1e3a5f", border: "#3b82f6" },
  done:    { bg: "#1e3a2f", border: "#10b981" },
  paused:  { bg: "#5f4a1e", border: "#f59e0b" },
  error:   { bg: "#5f1e1e", border: "#ef4444" },
};

let network = null;
let nodesDS = null;
let nodeKindMap = {};
let currentSession = null;
let stream = null;

async function loadGraph() {
  const g = await fetch("/api/graph").then(r => r.json());
  const nodes = g.nodes.map(n => {
    nodeKindMap[n.id] = n.kind;
    const col = NODE_KIND_COLOR[n.kind] || STATE_COLOR.idle;
    return {
      id: n.id, label: n.label,
      color: { background: col.bg, border: col.border,
               highlight: { background: col.bg, border: col.border } },
      font: { color: "#e2e8f0", face: "ui-monospace, monospace", size: 14 },
      shape: "box", margin: 12, borderWidth: 2,
      shadow: { enabled: false },
    };
  });
  const edges = g.edges.map(e => ({
    from: e.from, to: e.to, label: e.label || "",
    arrows: "to", color: { color: "#475569" },
    font: { color: "#94a3b8", size: 10, background: "#0a0e13", strokeWidth: 0 },
    smooth: { type: "cubicBezier" },
  }));
  nodesDS = new vis.DataSet(nodes);
  const edgesDS = new vis.DataSet(edges);
  network = new vis.Network(document.getElementById("graph"),
    { nodes: nodesDS, edges: edgesDS },
    {
      layout: { hierarchical: { direction: "UD", sortMethod: "directed", levelSeparation: 110, nodeSpacing: 180 } },
      interaction: { dragNodes: true, zoomView: true, hover: true },
      physics: { enabled: false },
    });
}

function paintNode(id, stateName) {
  if (!nodesDS || !id) return;
  const col = STATE_COLOR[stateName];
  if (!col) return;
  nodesDS.update({
    id,
    color: { background: col.bg, border: col.border,
             highlight: { background: col.bg, border: col.border } },
    borderWidth: stateName === "running" ? 4 : 2,
  });
}

function resetAllNodes() {
  if (!nodesDS) return;
  nodesDS.forEach(n => {
    const kind = nodeKindMap[n.id] || "entry";
    const col = NODE_KIND_COLOR[kind] || STATE_COLOR.idle;
    nodesDS.update({
      id: n.id, borderWidth: 2,
      color: { background: col.bg, border: col.border,
               highlight: { background: col.bg, border: col.border } },
    });
  });
}

function appendTrace(line, kind = "running") {
  const t = document.getElementById("trace");
  if (t.querySelector(".meta")) t.innerHTML = "";
  const el = document.createElement("div");
  el.className = "step " + kind;
  el.innerHTML = line;
  t.appendChild(el);
  t.parentElement.scrollTop = t.parentElement.scrollHeight;
}

function renderSnapshot(snap) {
  if (!snap) return;
  const mbox = document.getElementById("messages");
  mbox.innerHTML = snap.messages.length === 0
    ? '<div class="meta" style="padding:0">—</div>'
    : snap.messages.map(m =>
        `<div class="msg ${m.role}"><div class="role">${m.role} · ${m.kind}</div>` +
        `<div class="body">${escapeHTML(m.text)}</div></div>`).join("");
  const v = document.getElementById("vars");
  const keys = Object.keys(snap.variables);
  v.innerHTML = keys.length === 0 ? "—" :
    keys.map(k => `<div><span class="k">${escapeHTML(k)}</span> = <span class="v">${escapeHTML(JSON.stringify(snap.variables[k]))}</span></div>`).join("");
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function showApproval(show) {
  document.getElementById("approvalRow").style.display = show ? "flex" : "none";
}

function attachStream(sessionID) {
  if (stream) stream.close();
  stream = new EventSource("/api/events?session=" + encodeURIComponent(sessionID));
  stream.onmessage = (e) => {
    const ev = JSON.parse(e.data);
    switch (ev.type) {
      case "node_enter":
        paintNode(ev.nodeID, "running");
        appendTrace(`▸ <b>${ev.nodeID}</b> <span class="elapsed">step ${ev.step}</span>`, "running");
        if (ev.snapshot) renderSnapshot(ev.snapshot);
        break;
      case "node_exit":
        paintNode(ev.nodeID, "done");
        appendTrace(`✓ ${ev.nodeID} <span class="elapsed">${ev.elapsed}</span>`, "done");
        if (ev.snapshot) renderSnapshot(ev.snapshot);
        break;
      case "node_error":
        // HumanNeeded fires OnError → we treat it as paused visually
        paintNode(ev.nodeID, "paused");
        appendTrace(`⏸ ${ev.nodeID} — ${escapeHTML(ev.error || "")}`, "paused");
        break;
      case "paused":
        showApproval(true);
        appendTrace(`⏸ paused at <b>${ev.nodeID}</b> — awaiting human approval`, "paused");
        if (ev.snapshot) renderSnapshot(ev.snapshot);
        break;
      case "completed":
        if (ev.nodeID) paintNode(ev.nodeID, "done");
        appendTrace(`🎉 completed at <b>${ev.nodeID}</b>`, "done");
        if (ev.snapshot) renderSnapshot(ev.snapshot);
        showApproval(false);
        if (stream) stream.close();
        break;
      case "failed":
        if (ev.nodeID) paintNode(ev.nodeID, "error");
        appendTrace(`✗ failed — ${escapeHTML(ev.error || "")}`, "error");
        if (ev.snapshot) renderSnapshot(ev.snapshot);
        if (stream) stream.close();
        break;
    }
  };
  stream.onerror = () => { /* server closes on completion — quiet */ };
}

async function startRun() {
  const text = document.getElementById("input").value.trim();
  if (!text) return;
  resetAllNodes();
  document.getElementById("trace").innerHTML = "";
  document.getElementById("messages").innerHTML = '<div class="meta" style="padding:0">—</div>';
  document.getElementById("vars").innerHTML = "—";
  showApproval(false);
  const res = await fetch("/api/run", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ message: text }),
  }).then(r => r.json());
  currentSession = res.sessionID;
  attachStream(currentSession);
}

async function resumeRun(approved) {
  if (!currentSession) return;
  showApproval(false);
  await fetch("/api/resume", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ sessionID: currentSession, approved }),
  });
  appendTrace(`▸ <b>resume(approved=${approved})</b>`, "running");
}

document.getElementById("sendBtn").addEventListener("click", startRun);
document.getElementById("approveBtn").addEventListener("click", () => resumeRun(true));
document.getElementById("rejectBtn").addEventListener("click", () => resumeRun(false));
document.querySelectorAll("[data-preset]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.getElementById("input").value = btn.dataset.preset;
    startRun();
  });
});

loadGraph();
</script>
</body>
</html>
